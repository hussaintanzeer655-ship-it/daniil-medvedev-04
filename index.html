<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Daniil Medvedev – Contact Card</title>
  <link rel='stylesheet' href='styles.css'>
</head>
<body>
  <header class='site-header'>
    <h1>Contact Card</h1>
    <button id='themeBtn' aria-label='Toggle theme'>Dark</button>
  </header>
  <section class='panel' id='card'>
    <div class='card'>
      <h3>Daniil Medvedev</h3>
      <p class='muted'>Professional presence with contact form</p>
      <form id='contactForm'>
        <input placeholder='Your name' required>
        <input placeholder='Email' type='email' required>
        <textarea placeholder='Message' rows='4'></textarea>
        <button type='submit'>Send</button>
      </form>
    </div>
  </section>
  <footer class='site-footer'>© 2026</footer>
  <script src='script.js'></script>
</body>
</html>
